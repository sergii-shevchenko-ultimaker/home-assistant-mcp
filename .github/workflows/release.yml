name: Publish Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.3.4)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  test-and-verify:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --prefix mcp-server playwright install --with-deps chromium

      - name: Type Check & Test MCP Server
        run: |
          npm run --prefix mcp-server lint
          npm run --prefix mcp-server test

      - name: Run Add-on Tests
        run: uv run --directory ha-mcp-helper --extra dev pytest tests

  publish-addon-containers:
    name: Build & Publish Add-on (${{ matrix.arch }})
    needs: [test-and-verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Name & Version
        id: image_info
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "Resolved Add-on Version: ${CLEAN_VERSION} for owner: ${OWNER_LOWER}"

      - name: Build and Push Add-on Container Image
        uses: docker/build-push-action@v6
        with:
          context: ha-mcp-helper
          file: ha-mcp-helper/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.image_info.outputs.owner }}/ha-mcp-helper-${{ matrix.arch }}:${{ steps.image_info.outputs.version }}
            ghcr.io/${{ steps.image_info.outputs.owner }}/ha-mcp-helper-${{ matrix.arch }}:latest
          labels: |
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.image_info.outputs.version }}
            io.hass.type=addon
            io.hass.name=Home Assistant AI Helper
            io.hass.description=Lightweight and secure AI agent companion for Home Assistant
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image_info.outputs.version }}

  publish-mcp-package:
    name: Build & Attach Standalone MCP Archive
    needs: [test-and-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Package Standalone MCP Archive
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          TAG="v${CLEAN_VERSION}"
          ARCHIVE_NAME="ha-ai-mcp-server-${TAG}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C mcp-server package.json dist

      - name: Attach Archive to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          TAG="v${CLEAN_VERSION}"
          ARCHIVE_NAME="ha-ai-mcp-server-${TAG}.tar.gz"
          if [ -f "${ARCHIVE_NAME}" ]; then
            gh release upload "${TAG}" "${ARCHIVE_NAME}" --clobber || true
          fi
