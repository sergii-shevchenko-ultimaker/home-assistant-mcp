name: Publish Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write
  packages: write

jobs:
  test-and-verify:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --prefix mcp-server playwright install --with-deps chromium

      - name: Type Check & Test MCP Server
        run: |
          npm run --prefix mcp-server lint
          npm run --prefix mcp-server test

      - name: Run Add-on Tests
        run: uv run --directory ha-mcp-helper --extra dev pytest tests

  publish-addon-containers:
    name: Build & Publish Add-on (${{ matrix.arch }})
    needs: [test-and-verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64, armv7, armhf, i386]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on Image to GHCR
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target ha-mcp-helper \
            --image "ha-mcp-helper-{arch}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --version "${{ github.event.release.tag_name || github.event.inputs.tag_name }}"

  publish-mcp-package:
    name: Build & Attach Standalone MCP Archive
    needs: [test-and-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Package Standalone MCP Archive
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          ARCHIVE_NAME="ha-ai-mcp-server-${TAG}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C mcp-server package.json dist

      - name: Attach Archive to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
        run: |
          ARCHIVE_NAME="ha-ai-mcp-server-${TAG}.tar.gz"
          if [ -f "${ARCHIVE_NAME}" ]; then
            gh release upload "${TAG}" "${ARCHIVE_NAME}" --clobber
          fi
