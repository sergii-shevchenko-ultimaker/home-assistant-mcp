name: Draft Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  draft_release:
    name: Draft Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract Version & Changelog Notes
        id: release_data
        run: |
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const version = pkg.version;
          const cleanVer = version.replace(/^v/, "");
          
          const changelogPath = "ha-mcp-helper/CHANGELOG.md";
          if (!fs.existsSync(changelogPath)) {
            console.error("❌ ERROR: ha-mcp-helper/CHANGELOG.md does not exist!");
            process.exit(1);
          }
          
          const lines = fs.readFileSync(changelogPath, "utf8").split(/\r?\n/);
          const result = [];
          let recording = false;
          for (const line of lines) {
            const headerMatch = line.match(/^##\s+v?(\d+\.\d+\.\d+.*)$/);
            if (headerMatch) {
              if (headerMatch[1] === cleanVer) {
                recording = true;
                continue;
              } else if (recording) {
                break;
              }
            } else if (recording) {
              result.push(line);
            }
          }
          
          const notes = result.join("\n").trim();
          if (!notes) {
            console.error(`❌ ERROR: No changelog section found for version "${cleanVer}" in ha-mcp-helper/CHANGELOG.md!`);
            console.error(`Please add "## ${cleanVer}" with release notes to ha-mcp-helper/CHANGELOG.md before drafting.`);
            process.exit(1);
          }
          
          fs.writeFileSync("release_notes.md", `## What'\''s Changed in v${cleanVer}\n\n${notes}\n`);
          
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${cleanVer}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=v${cleanVer}\n`);
          '
          echo "Drafting release for ${{ steps.release_data.outputs.tag }}"
          cat release_notes.md

      - name: Create or Update Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_data.outputs.tag }}
          TITLE: ${{ steps.release_data.outputs.title }}
        run: |
          # Query existing draft release ID if one exists
          DRAFT_ID=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.draft == true) | .id" | head -n 1)

          if [ -n "$DRAFT_ID" ]; then
            echo "Updating existing draft release (ID: $DRAFT_ID) to $TAG..."
            gh api --method PATCH "repos/${{ github.repository }}/releases/$DRAFT_ID" \
              -f tag_name="$TAG" \
              -f name="$TITLE" \
              -F body=@release_notes.md
          else
            echo "Creating new release draft for $TAG with changelog notes..."
            gh release create "$TAG" \
              --title "$TITLE" \
              --draft \
              --notes-file release_notes.md
          fi
