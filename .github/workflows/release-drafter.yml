name: Draft Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  draft_release:
    name: Draft Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release Tag: v${VERSION}"

      - name: Create or Update Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg_version.outputs.tag }}
          TITLE: ${{ steps.pkg_version.outputs.title }}
        run: |
          # Query existing draft release ID if one exists
          DRAFT_ID=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.draft == true) | .id" | head -n 1)

          if [ -n "$DRAFT_ID" ]; then
            echo "Updating existing draft release (ID: $DRAFT_ID) to $TAG..."
            gh api --method PATCH "repos/${{ github.repository }}/releases/$DRAFT_ID" \
              -f tag_name="$TAG" \
              -f name="$TITLE" \
              -F generate_release_notes=true
          else
            echo "Creating new release draft for $TAG with automatic notes..."
            gh release create "$TAG" \
              --title "$TITLE" \
              --draft \
              --generate-notes
          fi
